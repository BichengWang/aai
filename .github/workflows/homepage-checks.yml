name: Homepage checks

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "homepage/**"
      - "netlify.toml"
      - ".github/workflows/homepage-checks.yml"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: homepage
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: homepage/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Email endpoint tests
        run: npm run test:server

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Enquiry end-to-end tests
        run: npx playwright test e2e/enquiry.spec.ts

      - name: Verify production build
        run: npm run build

      - name: Prerendered site end-to-end tests
        run: npx playwright test -c playwright.built.config.ts
