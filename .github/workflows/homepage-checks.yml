name: Homepage checks

on:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: homepage
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: homepage/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Email endpoint tests
        run: npm run test:server

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Enquiry end-to-end tests
        run: npx playwright test e2e/enquiry.spec.ts

      - name: Verify production build
        run: npm run build
        env:
          # Placeholder project, as in playwright.built.config.ts.
          VITE_SUPABASE_URL: https://example.com
          VITE_SUPABASE_PUBLISHABLE_KEY: playwright-publishable-key

      - name: Prerendered site end-to-end tests
        run: npx playwright test -c playwright.built.config.ts
