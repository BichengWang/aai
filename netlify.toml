[build]
  base = "homepage"
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Cloudflare Pages serves /TradingAgents/ through functions/TradingAgents;
# on Netlify the Research link goes to the reports' GitHub Pages origin.
[[redirects]]
  from = "/TradingAgents/*"
  to = "https://bichengwang.github.io/TradingAgents/:splat"
  status = 302

# Paths without a file of their own get the empty app shell. Prerendered
# pages (/services.html, ...) shadow this rule; index.html is the home page.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 200
